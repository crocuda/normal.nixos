# Better config than default
CONFIG_ZMK_MOUSE=y


# Nightly bluetooth
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

## Bug fix
# Faulty oscillator
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_BT_CTLR_PHY_2M=n
# Use higher power BT for better connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable deep sleep support (default n)
CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_IDLE_TIMEOUT=600000
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Report battery level every minute
CONFIG_ZMK_BATTERY_REPORTING=y

# Enable NK-Rollover
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# USB
CONFIG_USB_DEVICE_VID=0xa8f8
CONFIG_USB_DEVICE_PID=0x1829
CONFIG_USB_DEVICE_MANUFACTURER="Bastard Keyboards"

CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_BOOT=y

# Debug
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=1000


[[pipelines]]
name = "test:flake"

[[pipelines.steps]]
name = "build testing flake"
commands = [
  # Update flake deps
  "nix flake update --flake ./templates/dendritic_flake_test",
  # Build flake
  """
  nixos-rebuild build \
  --flake './templates/dendritic_flake_test#default' \
  --override-input normal ./
  """,
]

[[pipelines]]
name = "test:vm:flake"

[[pipelines.steps]]
name = "run testing vm"
commands = [
  # Update flake deps
  "nix flake update --flake ./templates/dendritic_flake_test",
  # Build flake
  """
  nix run \
  --flake './templates/dendritic_flake_test#vm' \
  --override-input normal ./
  """,
]

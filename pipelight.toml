[[pipelines]]
name = "test-nixosModule"

[[pipelines.steps]]
name = "run flake test"
commands = [
  # Update flake deps
  "nix flake update --flake ./templates/dendritic_flake_test",
  # Build flake
  """
  nixos-rebuild build \
  --flake './templates/dendritic_flake_test#default' \
  --override-input normal ./
  """,
]
